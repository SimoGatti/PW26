{% extends 'base.html' %}{% block content %}<h1>{{ quiz.titolo }}</h1><form method="post">{% csrf_token %}<input type="hidden" name="attempt_token" value="{{ attempt.token }}">{% for question in quiz.question_list %}<fieldset><legend>{{ question.number }}. {{ question.text }}</legend>{% for answer in question.answers %}<label><input type="{% if question.multiple %}checkbox{% else %}radio{% endif %}" name="q_{{ question.number }}" value="{{ answer.answer_number }}" {% if answer.answer_number in question.selected %}checked{% endif %}> {{ answer.answer_text }}</label>{% endfor %}</fieldset>{% endfor %}<button>Invia risposte</button></form><form method="post" action="{% url 'abandon' %}">{% csrf_token %}<button class="secondary">Abbandona</button></form>{% endblock %}
