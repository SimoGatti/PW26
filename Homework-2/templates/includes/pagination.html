{% if pages > 1 %}<nav class="pagination">{% if state.page > 1 %}<a href="?{{ state.query }}&page={{ state.page|add:'-1' }}">Precedente</a>{% endif %}<span>Pagina {{ state.page }} di {{ pages }}</span>{% if state.page < pages %}<a href="?{{ state.query }}&page={{ state.page|add:'1' }}">Successiva</a>{% endif %}<form method="get">{% for key,value in state.params.items %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<label>Vai a pagina <input type="number" name="page" min="1" max="{{ pages }}"></label><button>Vai</button></form></nav>{% endif %}
